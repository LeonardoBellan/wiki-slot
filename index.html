<!doctype html>
<html lang="it">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Wiki Slot Machine</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="slot-machine">
            <h2>Il tuo nome in codice è...</h2>

            <div class="slot-window">
                <ul class="reel" id="reel">
                    <!-- Voci temporanee durante il caricamento -->
                    <li>Scansionando...</li>
                    <li>Mescolando...</li>
                    <li>Connettendo...</li>
                    <li>Ricerca API...</li>
                    <!-- Il primo elemento è duplicato qui in fondo per rendere il loop invisibile -->
                    <li>Scansionando...</li>
                </ul>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
